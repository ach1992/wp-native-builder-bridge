name: One-time obsolete branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'ach1992/wp-native-builder-bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged obsolete topic branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_TO_DELETE: fix/restore-development-continuity
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_TO_DELETE}")"

          if [[ "${status}" == "204" || "${status}" == "404" ]]; then
            exit 0
          fi

          cat "${response_file}"
          exit 1
